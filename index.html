<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI画像制作オーダー</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: sans-serif;
      color: #222;
      background: #f3f4f8;
    }
    main {
      max-width: 560px;
      margin: 40px auto;
      padding: 32px 24px;
      text-align: center;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px #00000012;
    }
    h1 { font-size: 26px; }
    p { color: #555; line-height: 1.8; }
    a {
      display: block;
      margin-top: 24px;
      padding: 15px;
      border-radius: 9px;
      color: white;
      background: #635bdb;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
    }
    .note { margin-top: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>AI画像制作オーダー</h1>
    <p><strong>料金（予定）：通常サイズ 1枚 500円</strong></p>
    <p>あなただけのオリジナル画像を制作します。<br>
      ご希望の内容をフォームからお送りください。</p>

    <a href="https://docs.google.com/forms/d/e/1FAIpQLScxb8xBqpVXTHjKSekn7UcY0VQNVmwZ-N0pQp9bE8xz-d3nog/viewform?usp=header">
      注文フォームを開く
    </a>

    <p class="note">
      ※現在、決済・画像生成・受付完了メールは自動化されていません。
    </p>
  </main>
</body>
</html>
