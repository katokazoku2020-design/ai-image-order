<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI画像制作オーダー</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: sans-serif;
      background: #f3f4f8;
      color: #222;
    }
    .container {
      max-width: 560px;
      margin: auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px #00000012;
    }
    h1 { text-align: center; font-size: 25px; }
    .description { text-align: center; color: #666; }
    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    textarea { min-height: 110px; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 9px;
      background: #635bdb;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }
    .notice {
      margin-top: 20px;
      padding: 12px;
      background: #f1f0ff;
      border-radius: 8px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>AI画像制作オーダー</h1>
    <p class="description">あなただけのオリジナル画像を制作します。</p>

    <form id="orderForm">
      <label for="name">お名前・ニックネーム</label>
      <input id="name" name="name" required>

      <label for="email">連絡用メールアドレス</label>
      <input id="email" name="email" type="email" required>

      <label for="type">画像の種類</label>
      <select id="type" name="type">
        <option>アニメ風</option>
        <option>リアル風</option>
        <option>ファンタジー風</option>
        <option>その他</option>
      </select>

      <label for="description">画像の希望・イメージ</label>
      <textarea id="description" name="description"
        placeholder="キャラクター、服装、背景、ポーズなど"></textarea>

      <label for="size">画像サイズ</label>
      <select id="size" name="size">
        <option>通常サイズ</option>
        <option>高画質サイズ（後日対応予定）</option>
      </select>

      <button type="submit">注文内容を確認する</button>
    </form>

    <div class="notice">
      ※ 現在は注文ページの試作版です。送信・決済・画像生成はまだ実行されません。
    </div>
  </main>

  <script>
    document.getElementById("orderForm").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("注文ページの試作版です。現在、注文受付はまだ開始していません。");
    });
  </script>
</body>
</html>
